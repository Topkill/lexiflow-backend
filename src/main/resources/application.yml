server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lexiflow-backend
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.lexiflow

lexiflow:
  security:
    jwt-secret: change-me-to-a-strong-secret-at-least-32-bytes
    access-token-ttl-minutes: 120
    refresh-token-ttl-days: 14
  crypto:
    api-key-secret: change-me-32-bytes-secret-for-api-key
